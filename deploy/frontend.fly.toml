# Fly.io config for the frontend (the public website). PREPARED, NOT YET USED: see DEPLOY.md.
# The app name must be unique across all of Fly.io; change it if `fly apps create` says it is taken.
app = "deptinfo-aueb-web"
primary_region = "fra"

[env]
  # Must match the backend app's name in backend.fly.toml.
  BACKEND_URL = "http://deptinfo-aueb-api.internal:8080"

[http_service]
  internal_port = 3000
  force_https = true
  # Stateless, so it can sleep when idle and wake on the next request (saves money; first visit after a pause is slower).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.health]
    type = "http"
    port = 3000
    path = "/healthz"
    method = "GET"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
