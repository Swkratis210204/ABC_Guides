name: Checks

# Runs on every push and every proposed change. A red result means the change must not be accepted.
# Site build and deploy steps will be added once the site is designed.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # The content check runs first on purpose: if a content file is wrong, the run stops here
      # with only the plain-language message, instead of hundreds of lines of test output.
      - name: Check the content files
        run: python scripts/validate.py
      - name: Run all tests
        run: python -m pytest tests -q
