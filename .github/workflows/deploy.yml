name: Check content

# Runs on every change. Site build and deploy steps will be added once the site is designed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install jsonschema==4.23.0
      - name: Check the content files
        run: python scripts/validate.py
