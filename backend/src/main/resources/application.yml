spring:
  application:
    name: deptinfo
  jackson:
    # Omit null fields from responses; clients treat a missing field as "not applicable".
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  # Root folder that contains tenants/{uni}/{dept}/*.json. In dev (run from backend/) this is the repo seed folder.
  data-dir: ${DATA_DIR:../data-seed}
  # If data-dir/tenants is missing or empty, this folder is copied into it on first boot (production: baked into the image).
  seed-dir: ${SEED_DIR:}
  # Protects /api/admin/**. Empty = admin endpoints disabled.
  admin-api-key: ${ADMIN_API_KEY:}
